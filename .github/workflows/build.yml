name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Free Disk Space & Install Dependencies
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/system-images /opt/ghc /usr/local/share/boost /usr/share/dotnet
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
          mkdir -p "$HOME/Android/sdk/licenses"
          if [ -d "/usr/local/lib/android/sdk/licenses" ]; then
            cp -f /usr/local/lib/android/sdk/licenses/* "$HOME/Android/sdk/licenses/"
          fi

      - name: Build Pure-Python Wheels & APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false"
        run: |
          set +o pipefail
          unset ANDROID_HOME ANDROID_SDK_ROOT JAVA_HOME
          python -m pip install --upgrade pip wheel
          pip install flet==1.1.2
          mkdir -p /tmp/wheels
          pip wheel pyaes splusthon --no-deps -w /tmp/wheels
          export PIP_FIND_LINKS=/tmp/wheels
          for attempt in 1 2; do
            rm -rf "$HOME/Android/sdk/.temp"
            yes | flet build apk --arch arm64-v8a --verbose 2>&1 | sed 's/::group::/=== /g; s/::endgroup::/---/g'
            STATUS=${PIPESTATUS[1]}
            if [ "$STATUS" -eq 0 ]; then
              exit 0
            fi
            echo "Build attempt $attempt failed, cleaning temp SDK cache and retrying..."
          done
          exit $STATUS

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V3X-Selfbot-APK
          path: build/apk/*.apk
