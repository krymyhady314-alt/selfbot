name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Flet and Build APK
        run: |
          unset ANDROID_HOME ANDROID_SDK_ROOT JAVA_HOME
          python -m pip install --upgrade pip
          pip install flet==1.1.2
          printf "y\ny\ny\n" | flet build apk --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V3X-Selfbot-APK
          path: build/apk/*.apk
