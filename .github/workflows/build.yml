name: Build V3X Selfbot APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pre-accept Android SDK Licenses
        run: |
          mkdir -p "$HOME/Android/Sdk/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\ne9acab5b5fbb560a72cfaecce8946896ff6aab9d\n" > "$HOME/Android/Sdk/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$HOME/Android/Sdk/licenses/android-sdk-preview-license"
          printf "\n601085b94cd77f0b54ff86406957099ebe79c4d6\n" > "$HOME/Android/Sdk/licenses/android-googletv-license"
          printf "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a\n" > "$HOME/Android/Sdk/licenses/google-gdk-license"
          printf "\nd975f751698a77b662f1254ddbeed3901e976f5a\n" > "$HOME/Android/Sdk/licenses/intel-android-extra-license"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flet requests
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Build Universal APK (32-bit & 64-bit)
        run: |
          unset ANDROID_HOME ANDROID_SDK_ROOT JAVA_HOME
          flet build apk \
            --arch arm64-v8a armeabi-v7a \
            --project "v3x_selfbot" \
            --product "V3X Selfbot" \
            --org "ir.v3xsys" \
            --build-version "2.1.1" \
            --yes

      - name: Show Flutter Doctor on Failure
        if: failure()
        run: |
          unset ANDROID_HOME ANDROID_SDK_ROOT JAVA_HOME
          if [ -x "$HOME/flutter/3.47.9/bin/flutter" ]; then
            "$HOME/flutter/3.47.9/bin/flutter" doctor -v
          fi

      - name: Prepare APK file
        run: |
          mkdir -p release_apk
          APK_FILE=$(find build/apk -name "*.apk" | head -n 1)
          echo "Built APK: $APK_FILE"
          cp "$APK_FILE" release_apk/V3X-Selfbot-v2.1.1.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V3X-Selfbot-v2.1.1-APK
          path: release_apk/V3X-Selfbot-v2.1.1.apk

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.1
          name: V3X Selfbot v2.1.1 (32 & 64 Bit)
          files: release_apk/V3X-Selfbot-v2.1.1.apk
