name: Build V3X Selfbot APK (32 & 64 Bit)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter 3.47.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: "stable"

      - name: Install System & 32-bit Build Libraries
        run: |
          sudo dpkg --add-architecture i386 || true
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libglu1-mesa xz-utils unzip zip curl libc6:i386 libstdc++6:i386 zlib1g:i386 || sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libglu1-mesa xz-utils unzip zip curl

      - name: Fix Android SDK cmdline-tools & Configure Flutter
        run: |
          SDK_DIR="/usr/local/lib/android/sdk"
          sudo chown -R $(whoami):$(whoami) "$SDK_DIR"

          if [ ! -d "$SDK_DIR/cmdline-tools/latest" ]; then
            VER_DIR=$(find "$SDK_DIR/cmdline-tools" -mindepth 1 -maxdepth 1 -type d | head -n 1)
            if [ -n "$VER_DIR" ]; then
              ln -sfn "$VER_DIR" "$SDK_DIR/cmdline-tools/latest"
            fi
          fi

          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
          echo "GRADLE_OPTS=-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> $GITHUB_ENV

          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

          flutter config --no-enable-linux-desktop --no-enable-web --no-enable-macos-desktop --no-enable-windows-desktop --enable-android
          flutter config --android-sdk "$SDK_DIR"
          flutter doctor -v

      - name: Install Flet CLI & Sync Requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet[all]" requests
          FLET_VER=$(python -c "import importlib.metadata; print(importlib.metadata.version('flet'))")

          if [ -f requirements.txt ]; then
            grep -viE "^(flet|requests)" requirements.txt > extra_reqs.txt || true
          else
            touch extra_reqs.txt
          fi
          printf "flet==%s\nrequests\n" "$FLET_VER" > requirements.txt
          cat extra_reqs.txt >> requirements.txt
          rm -f extra_reqs.txt
          cat requirements.txt

      - name: Build Universal APK (arm64-v8a & armeabi-v7a)
        run: |
          flet -v build apk \
            --arch arm64-v8a armeabi-v7a \
            --project "v3x_selfbot" \
            --product "V3X Selfbot" \
            --org "ir.v3xsys" \
            --build-version "2.1.1" \
            --yes

      - name: Prepare APK for Release
        run: |
          mkdir -p release_apk
          APK_FILE=$(find build -type f -name "*release*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find build -type f -name "*.apk" | head -n 1)
          fi
          echo "Found APK: $APK_FILE"
          test -s "$APK_FILE"
          cp "$APK_FILE" release_apk/V3X-Selfbot-v2.1.1.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V3X-Selfbot-v2.1.1-APK
          path: release_apk/V3X-Selfbot-v2.1.1.apk

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.1
          name: V3X Selfbot v2.1.1 (32 & 64 Bit)
          files: release_apk/V3X-Selfbot-v2.1.1.apk
