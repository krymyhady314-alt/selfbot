name: Build V3X Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Flet CLI 0.25.2
        run: |
          python -m pip install --upgrade pip
          pip install "flet==0.25.2"

      - name: Bundle splusthon into _vendor cleanly
        run: |
          python - << 'EOF'
          import importlib.metadata
          import pathlib
          import py_compile
          import shutil
          import subprocess
          import sys

          main_py = pathlib.Path("main.py")
          if not main_py.exists():
              raise FileNotFoundError("main.py not found!")
          py_compile.compile(str(main_py), doraise=True)

          # Identify all modules already provided by flet==0.25.2
          flet_env_tops = set(sys.stdlib_module_names)
          flet_env_dists = set()
          for dist in importlib.metadata.distributions():
              name = (dist.metadata.get("Name") or "").lower().replace("_", "-")
              if name:
                  flet_env_dists.add(name)
              top_txt = dist.read_text("top_level.txt")
              if top_txt:
                  for line in top_txt.splitlines():
                      if line.strip():
                          flet_env_tops.add(line.strip())
              elif dist.files:
                  for f in dist.files:
                      p0 = f.parts[0]
                      if p0.endswith(".py"):
                          flet_env_tops.add(p0[:-3])
                      elif not p0.endswith((".dist-info", ".egg-info", ".data")):
                          flet_env_tops.add(p0)

          pkg_dir = pathlib.Path("/tmp/splusthon_vendor")
          if pkg_dir.exists():
              shutil.rmtree(pkg_dir)
          pkg_dir.mkdir(parents=True)

          subprocess.check_call([
              sys.executable, "-m", "pip", "install",
              "--no-cache-dir",
              "--target", str(pkg_dir),
              "splusthon",
          ])

          skip_dists = flet_env_dists | {"pip", "setuptools", "wheel", "distribute", "pkg-resources"}
          compiled_android_reqs = set()
          skip_top_items = set()

          for di in pkg_dir.glob("*.dist-info"):
              dist_name = di.name.split("-")[0]
              meta = di / "METADATA"
              if meta.exists():
                  for line in meta.read_text(errors="ignore").splitlines():
                      if line.startswith("Name: "):
                          dist_name = line.split(":", 1)[1].strip()
                          break
              norm_name = dist_name.lower().replace("_", "-")

              rec_tops = set()
              top_file = di / "top_level.txt"
              if top_file.exists():
                  for t in top_file.read_text(errors="ignore").splitlines():
                      if t.strip():
                          rec_tops.add(t.strip())
              else:
                  rec_tops.add(norm_name.replace("-", "_"))

              has_native = False
              record_file = di / "RECORD"
              if record_file.exists():
                  for row in record_file.read_text(errors="ignore").splitlines():
                      rel = row.split(",", 1)[0].strip()
                      if not rel or rel.startswith(".."):
                          continue
                      p0 = rel.split("/", 1)[0]
                      if not p0.endswith((".dist-info", ".egg-info", ".data")):
                          rec_tops.add(p0)
                      if rel.endswith((".so", ".pyd", ".dll", ".dylib")):
                          has_native = True

              if norm_name in skip_dists:
                  skip_top_items.update(rec_tops)
                  continue

              if has_native:
                  compiled_android_reqs.add(dist_name)
                  skip_top_items.update(rec_tops)
                  continue

          vendor_dir = pathlib.Path("_vendor")
          if vendor_dir.exists():
              shutil.rmtree(vendor_dir)
          vendor_dir.mkdir()

          for item in pkg_dir.iterdir():
              name = item.name
              if name.endswith((".dist-info", ".egg-info", ".libs", ".so", ".pyd", ".dll", ".dylib")):
                  continue
              if name in ("bin", "__pycache__") or name in skip_top_items:
                  continue
              base_mod = name[:-3] if name.endswith(".py") else name
              if base_mod in flet_env_tops and base_mod != "splusthon":
                  continue

              dest = vendor_dir / name
              if item.is_dir():
                  shutil.copytree(
                      item,
                      dest,
                      ignore=shutil.ignore_patterns("__pycache__", "*.pyc", "*.pyo", "*.so", "*.pyd", "*.dll", "*.dylib"),
                  )
              elif item.is_file() and item.suffix == ".py":
                  shutil.copy2(item, dest)

          for bad in list(vendor_dir.rglob("*")):
              if bad.is_file() and bad.suffix in (".so", ".pyd", ".dll", ".dylib"):
                  bad.unlink()

          if not ((vendor_dir / "splusthon").is_dir() or (vendor_dir / "splusthon.py").is_file()):
              raise RuntimeError("splusthon was not found in _vendor!")

          # Prepend 4-line _vendor path hook at the top of main.py without altering app structure
          orig_code = main_py.read_text(encoding="utf-8")
          hook = (
              "import os as _v3x_os, sys as _v3x_sys\n"
              "_v3x_vendor = _v3x_os.path.join(_v3x_os.path.dirname(_v3x_os.path.abspath(__file__)), '_vendor')\n"
              "if _v3x_os.path.isdir(_v3x_vendor) and _v3x_vendor not in _v3x_sys.path:\n"
              "    _v3x_sys.path.append(_v3x_vendor)\n\n"
          )
          main_py.write_text(hook + orig_code, encoding="utf-8")
          py_compile.compile(str(main_py), doraise=True)

          # Verify both flet and splusthon import cleanly
          sys.path.append(str(vendor_dir.resolve()))
          import flet
          import splusthon
          print("Verified imports OK -> flet:", flet.__file__, "| splusthon:", splusthon.__file__)

          reqs = ["flet==0.25.2", "requests"]
          for pkg in sorted(compiled_android_reqs):
              if pkg.lower().replace("_", "-") not in {"flet", "requests", "httpx", "httpcore", "anyio"}:
                  reqs.append(pkg)

          pathlib.Path("requirements.txt").write_text("\n".join(reqs) + "\n")
          deps_toml = ", ".join(f'"{r}"' for r in reqs)
          pyproject = (
              '[project]\n'
              'name = "v3x-selfbot"\n'
              'version = "2.1.1"\n'
              'description = "V3X Selfbot for SoroushPlus"\n'
              'requires-python = ">=3.9"\n'
              f'dependencies = [{deps_toml}]\n\n'
              '[tool.flet]\n'
              'org = "ir.v3xsys"\n'
              'product = "V3X Selfbot"\n'
              'company = "V3X"\n'
          )
          pathlib.Path("pyproject.toml").write_text(pyproject)
          print("Final requirements:", reqs)
          EOF

      - name: Build 64-bit APK (arm64-v8a)
        run: |
          rm -rf build
          flet build apk --arch arm64-v8a --verbose
          mkdir -p release-apks
          APK_64=$(find build/apk -name "*.apk" | head -n 1)
          test -n "$APK_64"
          cp "$APK_64" release-apks/V3X-Selfbot-64bit-arm64.apk

      - name: Build 32-bit APK (armeabi-v7a)
        run: |
          rm -rf build
          flet build apk --arch armeabi-v7a --verbose
          APK_32=$(find build/apk -name "*.apk" | head -n 1)
          test -n "$APK_32"
          cp "$APK_32" release-apks/V3X-Selfbot-32bit-armeabi-v7a.apk

      - name: Upload Both Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: V3X-Selfbot-Android-APKs
          path: release-apks/*.apk
