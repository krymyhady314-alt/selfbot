name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux & Android Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
          mkdir -p "$HOME/Android/sdk/licenses"
          if [ -d "/usr/local/lib/android/sdk/licenses" ]; then
            cp -f /usr/local/lib/android/sdk/licenses/* "$HOME/Android/sdk/licenses/"
          fi

      - name: Install Flet and Build APK
        run: |
          set +o pipefail
          unset ANDROID_HOME ANDROID_SDK_ROOT JAVA_HOME
          python -m pip install --upgrade pip
          pip install flet==1.1.2
          yes | flet build apk --verbose 2>&1 | sed 's/::group::/=== /g; s/::endgroup::/---/g'
          exit ${PIPESTATUS[1]}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V3X-Selfbot-APK
          path: build/apk/*.apk
