name: Build Flet Universal APK (32 & 64 Bit)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Flet & Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet[all]" requests
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Accept Android Licenses (if SDK preinstalled)
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME/cmdline-tools" ]; then
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          fi

      - name: Build Universal APK (arm64 & armeabi-v7a)
        run: |
          flet build apk \
            --arch arm64-v8a armeabi-v7a \
            --project "v3x_selfbot" \
            --product "V3X Selfbot" \
            --org "ir.v3xsys" \
            --build-version "2.1.1" \
            --yes \
            -v

      - name: Prepare Release File
        run: |
          mkdir -p release_apk
          APK_FILE=$(find build/apk -name "*.apk" | head -n 1)
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" release_apk/V3X-Selfbot-v2.1.1-Universal.apk

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.1-universal
          name: V3X Selfbot v2.1.1 (32 & 64 Bit)
          files: release_apk/V3X-Selfbot-v2.1.1-Universal.apk
