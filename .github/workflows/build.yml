name: Build Flet Universal APK (32 & 64 Bit)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install flet requests; fi

      - name: Build Universal APK (arm64 & armeabi-v7a)
        run: |
          flet build apk --arch arm64-v8a armeabi-v7a --build-version 2.1.1 --project "V3X Selfbot" --org "ir.v3xsys"

      - name: Prepare Release File
        run: |
          mkdir -p release_apk
          cp build/apk/*.apk release_apk/V3X-Selfbot-v2.1.1-Universal.apk

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.1-universal
          name: V3X Selfbot v2.1.1 (32 & 64 Bit)
          files: release_apk/V3X-Selfbot-v2.1.1-Universal.apk
