name: Build V3X Selfbot APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Accept Android SDK Licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools" ]; then
            SDK_MGR=$(find "$ANDROID_HOME/cmdline-tools" -name "sdkmanager" | head -n 1)
            if [ -n "$SDK_MGR" ]; then
              yes | "$SDK_MGR" --licenses || true
            fi
          fi
          mkdir -p "$HOME/Android/Sdk/licenses"
          if [ -d "$ANDROID_HOME/licenses" ]; then
            cp -rn "$ANDROID_HOME/licenses/"* "$HOME/Android/Sdk/licenses/" || true
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flet requests
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Build APK (64-bit & 32-bit for Galaxy M13)
        run: |
          flet build apk \
            --arch arm64-v8a armeabi-v7a \
            --project "v3x_selfbot" \
            --product "V3X Selfbot" \
            --org "ir.v3xsys" \
            --build-version "2.1.1" \
            --yes \
            -v

      - name: Prepare APK file
        run: |
          mkdir -p release_apk
          APK_FILE=$(find build/apk -name "*.apk" | head -n 1)
          echo "Built APK: $APK_FILE"
          cp "$APK_FILE" release_apk/V3X-Selfbot-v2.1.1.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V3X-Selfbot-v2.1.1-APK
          path: release_apk/V3X-Selfbot-v2.1.1.apk

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.1
          name: V3X Selfbot v2.1.1 (32 & 64 Bit)
          files: release_apk/V3X-Selfbot-v2.1.1.apk
