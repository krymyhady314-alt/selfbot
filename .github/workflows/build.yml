name: Build V3X Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Flet CLI 0.25.2
        run: |
          python -m pip install --upgrade pip
          pip install "flet==0.25.2"

      - name: Bundle splusthon & Low-End Android Optimizer
        run: |
          python - << 'EOF'
          import pathlib
          import py_compile
          import shutil
          import subprocess
          import sys

          main_py = pathlib.Path("main.py")
          if not main_py.exists():
              raise FileNotFoundError("main.py not found!")
          py_compile.compile(str(main_py), doraise=True)

          android_flet_dists = {
              "flet", "flet-core", "httpx", "httpcore", "anyio",
              "certifi", "h11", "idna", "sniffio", "repath", "typing-extensions",
              "pip", "setuptools", "wheel", "distribute", "pkg-resources"
          }
          android_flet_mods = set(sys.stdlib_module_names) | {
              "flet", "flet_core", "httpx", "httpcore", "anyio",
              "certifi", "h11", "idna", "sniffio", "repath", "typing_extensions"
          }

          pkg_dir = pathlib.Path("/tmp/splusthon_raw")
          if pkg_dir.exists():
              shutil.rmtree(pkg_dir)
          pkg_dir.mkdir(parents=True)

          subprocess.check_call([
              sys.executable, "-m", "pip", "install",
              "--no-cache-dir",
              "--target", str(pkg_dir),
              "splusthon",
          ])

          android_wheel_pkgs = set()
          skip_top_items = set()

          for di in pkg_dir.glob("*.dist-info"):
              dist_name = di.name.split("-")[0]
              meta = di / "METADATA"
              if meta.exists():
                  for line in meta.read_text(errors="ignore").splitlines():
                      if line.startswith("Name: "):
                          dist_name = line.split(":", 1)[1].strip()
                          break
              norm_name = dist_name.lower().replace("_", "-")

              rec_tops = set()
              top_file = di / "top_level.txt"
              if top_file.exists():
                  for t in top_file.read_text(errors="ignore").splitlines():
                      if t.strip():
                          rec_tops.add(t.strip())
              else:
                  rec_tops.add(norm_name.replace("-", "_"))

              has_native = False
              record_file = di / "RECORD"
              if record_file.exists():
                  for row in record_file.read_text(errors="ignore").splitlines():
                      rel = row.split(",", 1)[0].strip()
                      if not rel or rel.startswith(".."):
                          continue
                      p0 = rel.split("/", 1)[0]
                      if not p0.endswith((".dist-info", ".egg-info", ".data")):
                          rec_tops.add(p0)
                      if rel.endswith((".so", ".pyd", ".dll", ".dylib")):
                          has_native = True

              if norm_name in android_flet_dists:
                  skip_top_items.update(rec_tops)
                  continue

              if has_native:
                  probe = subprocess.run(
                      [
                          sys.executable, "-m", "pip", "install",
                          "--dry-run", "--ignore-installed", "--no-deps",
                          "--platform", "android_21_arm64_v8a",
                          "--python-version", "3.12",
                          "--only-binary=:all:",
                          "--extra-index-url", "https://pypi.flet.dev",
                          dist_name,
                      ],
                      capture_output=True,
                      text=True,
                  )
                  if probe.returncode == 0:
                      android_wheel_pkgs.add(dist_name)
                      skip_top_items.update(rec_tops)

          vendor_dir = pathlib.Path("_vendor")
          if vendor_dir.exists():
              shutil.rmtree(vendor_dir)
          vendor_dir.mkdir()

          for item in pkg_dir.iterdir():
              name = item.name
              if name.endswith((".dist-info", ".egg-info", ".libs", ".so", ".pyd", ".dll", ".dylib")):
                  continue
              if name in ("bin", "__pycache__") or name in skip_top_items:
                  continue
              base_mod = name[:-3] if name.endswith(".py") else name
              if base_mod in android_flet_mods:
                  continue

              dest = vendor_dir / name
              if item.is_dir():
                  shutil.copytree(
                      item,
                      dest,
                      ignore=shutil.ignore_patterns("__pycache__", "*.pyc", "*.pyo", "*.so", "*.pyd", "*.dll", "*.dylib"),
                  )
              elif item.is_file() and item.suffix == ".py":
                  shutil.copy2(item, dest)

          for bad in list(vendor_dir.rglob("*")):
              if bad.is_file() and bad.suffix in (".so", ".pyd", ".dll", ".dylib"):
                  bad.unlink()

          if not ((vendor_dir / "splusthon").is_dir() or (vendor_dir / "splusthon.py").is_file()):
              raise RuntimeError("splusthon missing from _vendor!")

          raw_lines = main_py.read_text(encoding="utf-8").splitlines()
          future_lines = []
          body_lines = []
          for line in raw_lines:
              if not body_lines and line.startswith("from __future__ import "):
                  future_lines.append(line)
              else:
                  body_lines.append(line)

          indented_body = "\n".join(("    " + l if l.strip() else "") for l in body_lines)

          shim_code = (
              "import gc as _v3x_gc, os as _v3x_os, sys as _v3x_sys, time as _v3x_time, threading as _v3x_threading, traceback as _v3x_tb, inspect as _v3x_inspect\n"
              "# Aggressive GC threshold to prevent RAM spikes on low-end Android phones\n"
              "_v3x_gc.set_threshold(400, 5, 5)\n\n"
              "_v3x_root = _v3x_os.path.dirname(_v3x_os.path.abspath(__file__))\n"
              "_v3x_vendor = _v3x_os.path.join(_v3x_root, '_vendor')\n"
              "if _v3x_os.path.isdir(_v3x_vendor) and _v3x_vendor not in _v3x_sys.path:\n"
              "    _v3x_sys.path.append(_v3x_vendor)\n\n"
              "import flet as _v3x_ft\n\n"
              "# Direct constructors for Flet 1.x helper methods on Flet 0.25.2 classes\n"
              "_v3x_ft.Padding.only = staticmethod(lambda left=0, top=0, right=0, bottom=0: _v3x_ft.Padding(left=left, top=top, right=right, bottom=bottom))\n"
              "_v3x_ft.Padding.all = staticmethod(lambda value: _v3x_ft.Padding(left=value, top=value, right=value, bottom=value))\n"
              "_v3x_ft.Padding.symmetric = staticmethod(lambda vertical=0, horizontal=0: _v3x_ft.Padding(left=horizontal, top=vertical, right=horizontal, bottom=vertical))\n"
              "_v3x_ft.Padding.zero = staticmethod(lambda: _v3x_ft.Padding(0, 0, 0, 0))\n\n"
              "_v3x_ft.Margin.only = staticmethod(lambda left=0, top=0, right=0, bottom=0: _v3x_ft.Margin(left=left, top=top, right=right, bottom=bottom))\n"
              "_v3x_ft.Margin.all = staticmethod(lambda value: _v3x_ft.Margin(left=value, top=value, right=value, bottom=value))\n"
              "_v3x_ft.Margin.symmetric = staticmethod(lambda vertical=0, horizontal=0: _v3x_ft.Margin(left=horizontal, top=vertical, right=horizontal, bottom=vertical))\n"
              "_v3x_ft.Margin.zero = staticmethod(lambda: _v3x_ft.Margin(0, 0, 0, 0))\n\n"
              "_v3x_ft.Border.all = staticmethod(lambda width=1, color=None: _v3x_ft.Border(top=_v3x_ft.BorderSide(width, color), right=_v3x_ft.BorderSide(width, color), bottom=_v3x_ft.BorderSide(width, color), left=_v3x_ft.BorderSide(width, color)))\n"
              "_v3x_ft.Border.only = staticmethod(lambda left=None, top=None, right=None, bottom=None: _v3x_ft.Border(left=left, top=top, right=right, bottom=bottom))\n"
              "_v3x_ft.Border.symmetric = staticmethod(lambda vertical=None, horizontal=None: _v3x_ft.Border(top=vertical, bottom=vertical, left=horizontal, right=horizontal))\n\n"
              "_v3x_ft.BorderRadius.all = staticmethod(lambda value: _v3x_ft.BorderRadius(top_left=value, top_right=value, bottom_left=value, bottom_right=value))\n"
              "_v3x_ft.BorderRadius.only = staticmethod(lambda top_left=0, top_right=0, bottom_left=0, bottom_right=0: _v3x_ft.BorderRadius(top_left=top_left, top_right=top_right, bottom_left=bottom_left, bottom_right=bottom_right))\n"
              "_v3x_ft.BorderRadius.horizontal = staticmethod(lambda left=0, right=0: _v3x_ft.BorderRadius(top_left=left, bottom_left=left, top_right=right, bottom_right=right))\n"
              "_v3x_ft.BorderRadius.vertical = staticmethod(lambda top=0, bottom=0: _v3x_ft.BorderRadius(top_left=top, top_right=top, bottom_left=bottom, bottom_right=bottom))\n\n"
              "_v3x_aligns = {\n"
              "    'CENTER': (0, 0), 'TOP_LEFT': (-1, -1), 'TOP_CENTER': (0, -1), 'TOP_RIGHT': (1, -1),\n"
              "    'CENTER_LEFT': (-1, 0), 'CENTER_RIGHT': (1, 0), 'BOTTOM_LEFT': (-1, 1), 'BOTTOM_CENTER': (0, 1), 'BOTTOM_RIGHT': (1, 1)\n"
              "}\n"
              "for _k, (_ax, _ay) in _v3x_aligns.items():\n"
              "    setattr(_v3x_ft.Alignment, _k, _v3x_ft.Alignment(_ax, _ay))\n"
              "    setattr(_v3x_ft.Alignment, _k.lower(), _v3x_ft.Alignment(_ax, _ay))\n\n"
              "if not hasattr(_v3x_ft, 'Button'):\n"
              "    def _v3x_btn(*args, **kwargs):\n"
              "        if args and not isinstance(args[0], str) and 'content' not in kwargs:\n"
              "            kwargs['content'] = args[0]\n"
              "            args = args[1:]\n"
              "        return _v3x_ft.ElevatedButton(*args, **kwargs)\n"
              "    _v3x_ft.Button = _v3x_btn\n\n"
          )

          wrapped_main = "\n".join(future_lines) + ("\n" if future_lines else "") + shim_code + (
              "_v3x_orig_app = _v3x_ft.app\n\n"
              "def _v3x_show_err(page: _v3x_ft.Page, title: str, err: str):\n"
              "    try:\n"
              "        page.clean()\n"
              "        page.bgcolor = '#0D0D0D'\n"
              "        page.scroll = _v3x_ft.ScrollMode.AUTO\n"
              "        page.padding = 16\n"
              "        page.add(\n"
              "            _v3x_ft.Text(title, color='#FF3B30', size=18, weight=_v3x_ft.FontWeight.BOLD),\n"
              "            _v3x_ft.Text(err, color='#FFFFFF', size=12, selectable=True),\n"
              "        )\n"
              "        page.update()\n"
              "    except Exception:\n"
              "        pass\n\n"
              "def _v3x_optimize_page(page: _v3x_ft.Page):\n"
              "    if not hasattr(page, 'show_dialog') and hasattr(page, 'open'):\n"
              "        page.show_dialog = page.open\n"
              "    if not hasattr(page, 'pop_dialog') and hasattr(page, 'close'):\n"
              "        page.pop_dialog = page.close\n"
              "    # Disable heavy page transition animations on low-end Android devices\n"
              "    try:\n"
              "        if page.theme is None:\n"
              "            page.theme = _v3x_ft.Theme()\n"
              "        page.theme.page_transitions = _v3x_ft.PageTransitionsTheme(\n"
              "            android=_v3x_ft.PageTransitionTheme.NONE,\n"
              "            ios=_v3x_ft.PageTransitionTheme.NONE,\n"
              "        )\n"
              "    except Exception:\n"
              "        pass\n"
              "    # Coalesce rapid burst updates so weak CPUs do not freeze\n"
              "    _orig_upd = page.update\n"
              "    _lock = _v3x_threading.Lock()\n"
              "    _last = [0.0]\n"
              "    _pending = [False]\n"
              "    def _flush():\n"
              "        with _lock:\n"
              "            _pending[0] = False\n"
              "            _last[0] = _v3x_time.monotonic()\n"
              "        try:\n"
              "            _orig_upd()\n"
              "        except Exception:\n"
              "            pass\n"
              "    def _smart_upd(*u_args, **u_kwargs):\n"
              "        if u_args or u_kwargs:\n"
              "            return _orig_upd(*u_args, **u_kwargs)\n"
              "        now = _v3x_time.monotonic()\n"
              "        with _lock:\n"
              "            if now - _last[0] >= 0.065:\n"
              "                _last[0] = now\n"
              "                _pending[0] = False\n"
              "                do_now = True\n"
              "            else:\n"
              "                do_now = False\n"
              "                if not _pending[0]:\n"
              "                    _pending[0] = True\n"
              "                    _t = _v3x_threading.Timer(0.065, _flush)\n"
              "                    _t.daemon = True\n"
              "                    _t.start()\n"
              "        if do_now:\n"
              "            return _orig_upd()\n"
              "    page.update = _smart_upd\n\n"
              "def _v3x_safe_app(target, *args, **kwargs):\n"
              "    if _v3x_inspect.iscoroutinefunction(target):\n"
              "        async def _w_async(page: _v3x_ft.Page):\n"
              "            _v3x_optimize_page(page)\n"
              "            page.bgcolor = '#0D0D0D'\n"
              "            page.update()\n"
              "            try:\n"
              "                return await target(page)\n"
              "            except Exception:\n"
              "                _v3x_show_err(page, 'V3X Runtime Error', _v3x_tb.format_exc())\n"
              "        return _v3x_orig_app(_w_async, *args, **kwargs)\n"
              "    else:\n"
              "        def _w_sync(page: _v3x_ft.Page):\n"
              "            _v3x_optimize_page(page)\n"
              "            page.bgcolor = '#0D0D0D'\n"
              "            page.update()\n"
              "            try:\n"
              "                return target(page)\n"
              "            except Exception:\n"
              "                _v3x_show_err(page, 'V3X Runtime Error', _v3x_tb.format_exc())\n"
              "        return _v3x_orig_app(_w_sync, *args, **kwargs)\n\n"
              "_v3x_ft.app = _v3x_safe_app\n\n"
              "try:\n"
              f"{indented_body}\n"
              "except SystemExit:\n"
              "    raise\n"
              "except Exception:\n"
              "    _v3x_err = _v3x_tb.format_exc()\n"
              "    _v3x_orig_app(lambda p: _v3x_show_err(p, 'V3X Startup Error', _v3x_err))\n"
          )

          main_py.write_text(wrapped_main, encoding="utf-8")
          py_compile.compile(str(main_py), doraise=True)

          reqs = ["flet==0.25.2", "requests"] + sorted(android_wheel_pkgs)
          pathlib.Path("requirements.txt").write_text("\n".join(reqs) + "\n")
          deps_toml = ", ".join(f'"{r}"' for r in reqs)
          pyproject = (
              '[project]\n'
              'name = "v3x-selfbot"\n'
              'version = "2.2.0"\n'
              'description = "V3X Selfbot for SoroushPlus"\n'
              'requires-python = ">=3.9"\n'
              f'dependencies = [{deps_toml}]\n\n'
              '[tool.flet]\n'
              'org = "ir.v3xsys"\n'
              'product = "V3X Selfbot"\n'
              'company = "V3X"\n\n'
              '[tool.flet.android]\n'
              'min_sdk_version = 21\n'
              'target_sdk_version = 34\n'
          )
          pathlib.Path("pyproject.toml").write_text(pyproject)
          EOF

      - name: Build 64-bit APK (arm64-v8a)
        run: |
          rm -rf build
          flet build apk --arch arm64-v8a --verbose
          mkdir -p release-apks
          APK_64=$(find build/apk -name "*.apk" | head -n 1)
          test -n "$APK_64"
          cp "$APK_64" release-apks/V3X-Selfbot-64bit.apk

      - name: Build 32-bit APK (armeabi-v7a)
        run: |
          rm -rf build
          flet build apk --arch armeabi-v7a --verbose
          APK_32=$(find build/apk -name "*.apk" | head -n 1)
          test -n "$APK_32"
          cp "$APK_32" release-apks/V3X-Selfbot-32bit.apk

      - name: Upload Both Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: V3X-Selfbot-Android-APKs
          path: release-apks/*.apk

      - name: Publish Direct Download Links to Latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes || true
          git push origin :refs/tags/latest || true
          gh release create latest \
            release-apks/V3X-Selfbot-64bit.apk \
            release-apks/V3X-Selfbot-32bit.apk \
            --title "V3X Selfbot Android (Latest)" \
            --notes "نسخه رسمی اندروید سلف‌بات V3X — شامل نسخه ۶۴ بیتی و ۳۲ بیتی بهینه‌سازی‌شده"
