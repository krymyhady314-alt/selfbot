name: Build V3X Selfbot APK (32 & 64 Bit)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter 3.47.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: "stable"

      - name: Install Linux & Build Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libglu1-mesa xz-utils unzip zip curl

      - name: Configure Android SDK & Accept All Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name "sdkmanager" | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
            "$SDKMANAGER" "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" || true
            yes | "$SDKMANAGER" --licenses || true
          fi
          flutter config --android-sdk "$SDK_DIR"
          yes | flutter doctor --android-licenses || true
          flutter doctor -v

      - name: Prepare Python Requirements & Flet CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet[all]" requests
          if [ ! -f requirements.txt ]; then
            printf "flet\nrequests\n" > requirements.txt
          else
            sed -i 's/flet\[all\]/flet/g' requirements.txt
            if ! grep -qi "^requests" requirements.txt; then
              echo "requests" >> requirements.txt
            fi
          fi
          cat requirements.txt

      - name: Build Universal APK (arm64-v8a & armeabi-v7a)
        run: |
          flet build apk \
            --arch arm64-v8a armeabi-v7a \
            --project "v3x_selfbot" \
            --product "V3X Selfbot" \
            --org "ir.v3xsys" \
            --build-version "2.1.1" \
            --yes \
            -v

      - name: Prepare APK for Release
        run: |
          mkdir -p release_apk
          APK_FILE=$(find build -type f -name "*release*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find build -type f -name "*.apk" | head -n 1)
          fi
          echo "Found APK: $APK_FILE"
          test -s "$APK_FILE"
          cp "$APK_FILE" release_apk/V3X-Selfbot-v2.1.1.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V3X-Selfbot-v2.1.1-APK
          path: release_apk/V3X-Selfbot-v2.1.1.apk

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.1
          name: V3X Selfbot v2.1.1 (32 & 64 Bit)
          files: release_apk/V3X-Selfbot-v2.1.1.apk
