name: Build V3X Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Install Flet CLI
        run: |
          python -m pip install --upgrade pip
          pip install "flet>=0.24.1"

      - name: Ensure splusthon is bundled
        run: |
          if [ ! -d "splusthon" ] && [ ! -f "splusthon.py" ]; then
            grep -qxF "splusthon" requirements.txt || echo "splusthon" >> requirements.txt
          fi

      - name: Build Universal APK (32-bit & 64-bit)
        run: |
          flet build apk --arch arm64-v8a --arch armeabi-v7a --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: V3X-Selfbot-Universal-APK
          path: build/apk/*.apk
