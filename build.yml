name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.19.6"

      - name: Build APK Directly
        run: |
          python -m pip install --upgrade pip
          pip install flet==1.1.2 httpx splusthon
          
          # ساخت مستقیم بدون واسطه فلت کلی
          python -c "import flet; print('Flet Version:', flet.__version__)"
          
          # ساخت پکیج پروژه بدون پرامپت
          flet pack main.py --name V3X_Selfbot
          
          # کامپایل نهایی APK با خود فلاتر
          cd build && flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V3X-Selfbot-APK
          path: build/app/outputs/flutter-apk/app-release.apk
